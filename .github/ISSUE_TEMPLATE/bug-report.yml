name: 🐛 BUG 报告
description: 报告使用中遇到的问题
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈!请尽量填写以下信息,便于快速定位问题。

  - type: input
    id: version
    attributes:
      label: 版本号
      description: 在应用「设置 / 关于」中查看
      placeholder: "如 v0.1.21"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Windows
    validations:
      required: true

  - type: input
    id: platform
    attributes:
      label: 涉及的监控平台
      placeholder: "如 OpenAI、DeepSeek、智谱 GLM 等,通用问题可填「无」"

  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么?期望是什么?
      placeholder: 请描述具体现象
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 截图或日志
      description: 可直接粘贴截图

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开 ...
        2. 点击 ...
        3. 出现 ...
